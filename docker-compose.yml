  services:
    db:
      image: mysql
      container_name: roomhive-db
      restart: unless-stopped
      environment:
        MYSQL_ROOT_PASSWORD: roomhive_root
        MYSQL_DATABASE: roomhive
        MYSQL_USER: roomhive
        MYSQL_PASSWORD: roomhive_pass
      ports:
        - "3308:3306"
      volumes:
        - roomhive_mysql_data:/var/lib/mysql
      command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

    phpmyadmin:
      image: phpmyadmin
      container_name: roomhive-phpmyadmin
      restart: unless-stopped
      environment:
        PMA_HOST: db
        PMA_PORT: 3306
        UPLOAD_LIMIT: 512M
      ports:
        - "8082:80"
      depends_on:
        - db

  volumes:
    roomhive_mysql_data:
